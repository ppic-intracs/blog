<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catatan Kecilku</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #3a4a55;
            --primary-dark: #263238;
            --primary-soft: #4a5d68;
            --accent: #b8a58e;
            --accent-soft: #c9b9a6;
            --bg-body: #faf9f6;
            --bg-card: #ffffff;
            --bg-sidebar: #f8f7f4;
            --text-primary: #2f363a;
            --text-secondary: #5a6469;
            --text-muted: #8a9499;
            --border: #e9e6e1;
            --border-soft: #f0ede8;
            --shadow: 0 2px 16px rgba(38, 50, 56, 0.06);
            --shadow-soft: 0 1px 8px rgba(38, 50, 56, 0.04);
            --font-mono: 'JetBrains Mono', monospace;
            --padding-mobile: 16px;
            --padding-desktop: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: var(--font-mono); 
            background: var(--bg-body); 
            color: var(--text-primary); 
            min-height: 100vh;
            line-height: 1.7;
            font-weight: 300;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .navbar { 
            background: linear-gradient(135deg, var(--primary-dark), var(--primary)); 
            color: white; 
            padding: 12px var(--padding-desktop); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            height: 56px;
            border-bottom: 1px solid rgba(184, 165, 142, 0.3);
        }
        .navbar .logo { 
            font-family: var(--font-mono);
            font-size: 14px; 
            font-weight: 500; 
            display: flex; 
            align-items: center; 
            gap: 10px;
            letter-spacing: 0.5px;
            color: #fff;
        }
        .navbar .logo span { 
            background: rgba(184, 165, 142, 0.2); 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 10px; 
            color: var(--accent-soft);
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hamburger { 
            display: none; 
            flex-direction: column; 
            justify-content: space-between; 
            width: 26px; 
            height: 18px; 
            background: transparent; 
            border: none; 
            cursor: pointer; 
            padding: 0;
        }
        .hamburger span { 
            display: block; 
            width: 100%; 
            height: 1.5px; 
            background: rgba(255,255,255,0.9); 
            border-radius: 1px; 
            transition: 0.25s ease; 
        }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(4px, 4px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(4px, -4px); }

        .container { display: flex; min-height: calc(100vh - 56px); }

        .sidebar { 
            width: 280px; 
            background: var(--bg-sidebar); 
            border-right: 1px solid var(--border-soft); 
            display: flex; 
            flex-direction: column; 
            position: sticky; 
            top: 56px; 
            height: calc(100vh - 56px); 
            overflow-y: auto; 
            z-index: 500;
        }
        .sidebar-header { 
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
            color: white; 
            padding: 18px 20px; 
            text-align: center; 
            flex-shrink: 0;
            border-bottom: 1px solid rgba(184, 165, 142, 0.25);
        }
        .sidebar-header h3 { 
            font-family: var(--font-mono);
            font-size: 13px; 
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #fff;
        }
        .sidebar-header p { 
            font-size: 11px; 
            opacity: 0.85; 
            margin-top: 5px;
            font-weight: 300;
        }
        .sidebar-search { 
            padding: 14px 20px; 
            border-bottom: 1px solid var(--border-soft); 
            flex-shrink: 0; 
        }
        .sidebar-search input { 
            width: 100%; 
            padding: 10px 14px; 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            font-size: 12px; 
            outline: none; 
            background: white;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            font-family: var(--font-mono);
            font-weight: 300;
            color: var(--text-primary);
        }
        .sidebar-search input::placeholder { color: var(--text-muted); font-weight: 300; }
        .sidebar-search input:focus { 
            border-color: var(--accent-soft); 
            box-shadow: 0 0 0 3px rgba(184, 165, 142, 0.12);
        }

        .article-list { list-style: none; padding: 6px 0; }
        .article-list li { border-bottom: 1px solid var(--border-soft); }
        .article-list li a { 
            display: flex; 
            align-items: flex-start; 
            gap: 12px; 
            padding: 13px 18px; 
            text-decoration: none; 
            color: var(--text-primary); 
            cursor: pointer; 
            transition: all 0.2s ease;
            border-left: 2px solid transparent;
        }
        .article-list li a:hover { 
            background: rgba(184, 165, 142, 0.05); 
            border-left-color: var(--accent-soft);
        }
        .article-list li a:active { background: rgba(58, 74, 85, 0.05); }
        .article-list li a.active { 
            background: rgba(184, 165, 142, 0.1); 
            border-left-color: var(--accent); 
        }
        .article-list li a.active h4 { color: var(--primary); font-weight: 400; }

        .article-number { 
            background: rgba(58, 74, 85, 0.06); 
            color: var(--primary-soft); 
            min-width: 24px; 
            height: 24px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 10px; 
            font-weight: 400; 
            flex-shrink: 0;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }
        .article-list li a.active .article-number { 
            background: var(--accent); 
            color: white; 
        }

        .article-info { flex: 1; min-width: 0; }
        .article-info h4 { 
            font-family: var(--font-mono);
            font-size: 12px; 
            line-height: 1.5; 
            margin-bottom: 5px; 
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden;
            font-weight: 400;
            color: var(--text-primary);
            letter-spacing: 0.2px;
        }
        .article-meta { 
            font-size: 10px; 
            color: var(--text-muted); 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            font-weight: 300;
        }
        .article-meta .category { 
            background: rgba(58, 74, 85, 0.05); 
            color: var(--primary-soft); 
            padding: 2px 8px; 
            border-radius: 4px; 
            font-size: 9px; 
            font-weight: 400;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        /* ✅ FIX: Sidebar overlay untuk mobile */
        .sidebar-overlay { 
            display: none; 
            position: fixed; 
            top: 56px; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            background: rgba(38, 50, 56, 0.45); 
            z-index: 400; 
        }
        .sidebar-overlay.show { display: block; }

        .main-content { flex: 1; padding: 22px var(--padding-desktop); }
        .article-display { 
            background: var(--bg-card); 
            border-radius: 14px; 
            box-shadow: var(--shadow); 
            overflow: hidden;
            border: 1px solid var(--border-soft);
        }

        .article-cover { 
            width: 100%; 
            height: 140px; 
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--accent-soft); 
            font-size: 28px;
            border-bottom: 1px solid rgba(184, 165, 142, 0.3);
            position: relative;
        }
        .article-cover::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.6;
        }

        .article-body { padding: 24px var(--padding-desktop); }
        .article-body h1 { 
            font-family: var(--font-mono);
            font-size: 16px; 
            color: var(--primary); 
            margin-bottom: 14px; 
            line-height: 1.4;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .meta-bar { 
            display: flex; 
            gap: 16px; 
            padding-bottom: 16px; 
            margin-bottom: 22px; 
            border-bottom: 1px solid var(--border-soft); 
            font-size: 11px; 
            color: var(--text-secondary); 
            flex-wrap: wrap;
            font-weight: 300;
        }
        .meta-bar span { display: flex; align-items: center; gap: 4px; opacity: 0.9; }

        .content { 
            font-family: var(--font-mono);
            font-size: 13px; 
            line-height: 1.85; 
            color: var(--text-primary);
            font-weight: 300;
            letter-spacing: 0.1px;
            max-width: 100%;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            hyphens: auto;
        }
        .content p { margin-bottom: 16px; text-align: justify; }
        .content h2 { 
            color: var(--primary); 
            margin: 26px 0 12px; 
            font-size: 14px;
            font-family: var(--font-mono);
            font-weight: 500;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-soft);
            letter-spacing: 0.3px;
        }
        .content blockquote { 
            border-left: 2px solid var(--accent); 
            background: rgba(184, 165, 142, 0.08); 
            padding: 16px 18px; 
            margin: 18px 0; 
            border-radius: 0 4px 4px 0; 
            font-style: normal; 
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-weight: 300;
            font-size: 12px;
        }
        .content ul, .content ol { margin: 16px 0; padding-left: 22px; }
        .content li { margin-bottom: 10px; font-weight: 300; }

        .welcome-section { text-align: center; padding: 48px 20px; }
        .welcome-section h1 { 
            font-family: var(--font-mono);
            font-size: 18px; 
            margin-bottom: 14px;
            color: var(--primary);
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .welcome-section p { 
            font-size: 13px; 
            color: var(--text-secondary); 
            line-height: 1.75; 
            margin-bottom: 26px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            font-weight: 300;
        }
        .stats { 
            display: flex; 
            justify-content: center; 
            gap: 36px; 
            margin-top: 26px; 
            flex-wrap: wrap; 
        }
        .stat-item .number { 
            font-size: 20px; 
            font-weight: 400; 
            color: var(--accent);
            font-family: var(--font-mono);
            letter-spacing: 1px;
        }
        .stat-item .label { 
            font-size: 10px; 
            color: var(--text-muted); 
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 400;
        }

        .upload-btn { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            width: 46px; 
            height: 46px; 
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
            color: var(--accent-soft); 
            border: 1px solid var(--accent);
            border-radius: 50%; 
            font-size: 20px; 
            cursor: pointer; 
            box-shadow: var(--shadow-soft); 
            z-index: 999; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            transition: all 0.25s ease;
        }
        .upload-btn:hover { 
            transform: translateY(-2px);
            box-shadow: var(--shadow);
            background: linear-gradient(135deg, var(--primary-dark), #1f292e);
            color: var(--accent);
        }
        .upload-btn:active { transform: scale(0.97); }

        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(38, 50, 56, 0.65); 
            z-index: 2000; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }
        .modal-overlay.show { display: flex; }
        .modal { 
            background: var(--bg-card); 
            border-radius: 16px; 
            width: 100%; 
            max-width: 480px; 
            max-height: 90vh; 
            overflow-y: auto; 
            box-shadow: 0 20px 60px rgba(38, 50, 56, 0.2); 
            animation: slideUp 0.3s ease;
            border: 1px solid var(--border-soft);
        }
        @keyframes slideUp { 
            from { transform: translateY(20px); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }
        .modal-header { 
            padding: 18px 22px; 
            border-bottom: 1px solid var(--border-soft); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            background: var(--bg-card); 
            z-index: 10;
        }
        .modal-header h2 { 
            color: var(--primary); 
            font-size: 14px;
            font-family: var(--font-mono);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .modal-close { 
            background: rgba(58, 74, 85, 0.06); 
            border: none; 
            width: 26px; 
            height: 26px; 
            border-radius: 50%; 
            font-size: 18px; 
            cursor: pointer; 
            color: var(--text-muted); 
            display: flex; 
            align-items: center; 
            justify-content: center;
            transition: all 0.2s ease;
            font-weight: 300;
        }
        .modal-close:hover { background: rgba(184, 165, 142, 0.15); color: var(--primary); }

        .modal-body { padding: 22px 20px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { 
            display: block; 
            margin-bottom: 7px; 
            font-weight: 400; 
            color: var(--text-primary); 
            font-size: 11px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .form-group input, 
        .form-group textarea, 
        .form-group select { 
            width: 100%; 
            padding: 11px 13px; 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            font-size: 12px; 
            font-family: var(--font-mono);
            outline: none; 
            background: white;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            color: var(--text-primary);
            font-weight: 300;
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder { color: var(--text-muted); font-weight: 300; }
        .form-group input:focus, 
        .form-group textarea:focus, 
        .form-group select:focus { 
            border-color: var(--accent-soft);
            box-shadow: 0 0 0 3px rgba(184, 165, 142, 0.12);
        }
        .form-group textarea { 
            min-height: 150px; 
            resize: vertical;
            line-height: 1.8;
            font-weight: 300;
        }
        .btn-submit { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 12px; 
            font-weight: 400; 
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }
        .btn-submit:hover { 
            box-shadow: 0 5px 18px rgba(38, 50, 56, 0.15);
            transform: translateY(-1px);
        }
        .btn-submit:disabled { 
            opacity: 0.65; 
            cursor: not-allowed;
            transform: none;
        }

        .footer { 
            text-align: center; 
            padding: 18px; 
            color: var(--text-muted); 
            font-size: 10px; 
            background: var(--bg-card); 
            border-top: 1px solid var(--border-soft);
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .loading { text-align: center; padding: 48px; color: var(--primary-soft); font-weight: 300; font-size: 13px; }
        .error-msg { 
            background: rgba(192, 57, 43, 0.06); 
            color: #a94442; 
            padding: 13px 18px; 
            border-radius: 10px; 
            margin: 13px 18px; 
            font-size: 11px; 
            text-align: center;
            border-left: 2px solid #c0392b;
            font-weight: 300;
        }
        .error-msg small { display: block; margin-top: 6px; opacity: 0.85; font-size: 10px; }

        /* ✅ FIX: MOBILE RESPONSIVE - Sidebar toggle */
        @media (max-width: 768px) {
            .hamburger { display: flex; }
            
            .navbar {
                padding: 12px var(--padding-mobile);
            }
            
            /* ✅ Sidebar hidden di mobile, muncul saat class 'open' ditambahkan */
            .sidebar { 
                position: fixed; 
                top: 56px; 
                left: 0; 
                width: 260px; 
                max-width: 85vw; 
                height: calc(100vh - 56px); 
                transform: translateX(-100%); 
                box-shadow: 5px 0 25px rgba(38, 50, 56, 0.12);
                border-right: none;
                transition: transform 0.3s ease;
                z-index: 500;
            }
            
            .sidebar.open { 
                transform: translateX(0); 
            }
            
            .main-content { 
                padding: 18px var(--padding-mobile); 
            }
            
            .article-body { 
                padding: 20px var(--padding-mobile); 
            }
            
            .article-body h1 { 
                font-size: 15px;
                padding: 0;
            }
            
            .article-cover { 
                height: 120px; 
                font-size: 24px; 
            }
            
            .welcome-section { 
                padding: 40px var(--padding-mobile); 
            }
            
            .welcome-section h1 { 
                font-size: 16px; 
            }
            
            .welcome-section p { 
                font-size: 12px; 
            }
            
            .content { 
                font-size: 12px; 
                line-height: 1.8;
            }
            
            .modal-body {
                padding: 20px var(--padding-mobile);
            }
            
            .modal-header {
                padding: 16px var(--padding-mobile);
            }
        }

        .article-list li a { transition: all 0.2s ease; }
        .form-group input, .form-group textarea, .form-group select { transition: all 0.2s ease; }
        .upload-btn { transition: all 0.25s ease; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body>

    <nav class="navbar">
        <button class="hamburger" id="hamburger" onclick="toggleSidebar()">
            <span></span><span></span><span></span>
        </button>
        <div class="logo">📓 Catatan Kecil<span>Ku</span></div>
        <div style="width: 30px;"></div>
    </nav>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>Menu</h3>
                <p id="article-count">Memuat...</p>
            </div>
            <div class="sidebar-search">
                <input type="text" id="searchInput" placeholder="cari catatan..." oninput="searchArticles()">
            </div>
            <ul class="article-list" id="articleList"></ul>
        </aside>

        <main class="main-content" id="mainContent">
            <div class="loading">⏳ memuat catatan...</div>
        </main>
    </div>

    <div class="footer">© 2026 diaryku — ruang refleksi pribadi</div>

    <button class="upload-btn" onclick="openModal()" title="catat hari ini">+</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>✍️ tulis catatan baru</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <form onsubmit="submitArticle(event)">
                    <div class="form-group">
                        <label>judul catatan *</label>
                        <input type="text" id="inputTitle" placeholder="judul disini..." required>
                    </div>
                    <div class="form-group">
                        <label>kategori</label>
                        <select id="inputCategory">
                            <option value="Refleksi">Refleksi</option>
                            <option value="Target">Target & Rencana</option>
                            <option value="Syukur">Syukur</option>
                            <option value="Ide">Ide & Inspirasi</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>isi catatan *</label>
                        <textarea id="inputContent" placeholder="tuliskan apa yang ada di pikiranmu..." required></textarea>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn">simpan catatan</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://niumzhpcijztofrajwnf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pdW16aHBjaWp6dG9mcmFqd25mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMzg2NjIsImV4cCI6MjA5NDkxNDY2Mn0._AgZjHcp_cyLjNwTHcbEGA2Qv0LB4oVIjcRyt7wL5Zk';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let articles = [];
        let activeArticleId = null;
        let isLoading = false;

        function formatDate(isoString) {
            if (!isoString) return '-';
            return new Date(isoString).toLocaleDateString('id-ID', { 
                day: 'numeric', 
                month: 'short', 
                year: 'numeric' 
            });
        }

        async function fetchArticles() {
            if (isLoading) return;
            isLoading = true;
            
            const mainContent = document.getElementById('mainContent');
            if (articles.length === 0) {
                mainContent.innerHTML = `<div class="loading">⏳ memuat catatan...</div>`;
            }

            const { data, error } = await supabaseClient
                .from('articles')
                .select('*')
                .order('created_at', { ascending: false });

            isLoading = false;

            if (error) {
                console.error('Supabase Error:', error);
                mainContent.innerHTML = `
                    <div class="article-display">
                        <div class="error-msg">❌ gagal memuat: ${error.message}<br>
                        <small>pastikan url & api key benar</small></div>
                        <div class="welcome-section">
                            <h1>👋 mode demo</h1>
                            <p>database belum terhubung. isi form untuk menyimpan catatan pertama.</p>
                        </div>
                    </div>`;
                return;
            }

            articles = data || [];
            renderSidebar();
            showWelcome();
        }

        function renderSidebar(filtered = null) {
            const list = document.getElementById('articleList');
            const data = filtered || articles;

            document.getElementById('article-count').textContent = `${articles.length} catatan`;

            if (data.length === 0) {
                list.innerHTML = `<li><div style="padding:30px;text-align:center;color:var(--text-muted);font-style:italic;font-weight:300;font-size:11px;">belum ada catatan</div></li>`;
                return;
            }

            list.innerHTML = data.map((article, index) => `
                <li>
                    <a onclick="selectArticle(${article.id})" class="${article.id === activeArticleId ? 'active' : ''}">
                        <span class="article-number">${String(index + 1).padStart(2, '0')}</span>
                        <div class="article-info">
                            <h4>${article.title}</h4>
                            <div class="article-meta">
                                <span>${formatDate(article.created_at)}</span>
                                <span class="category">${article.category}</span>
                            </div>
                        </div>
                    </a>
                </li>
            `).join('');
        }

        function selectArticle(id) {
            showArticle(id);
            if (window.innerWidth <= 768) closeSidebar();
        }

        function showArticle(id) {
            const article = articles.find(a => a.id === id);
            if (!article) return;

            activeArticleId = id;
            renderSidebar();

            const gradients = [
                'linear-gradient(135deg, var(--primary), var(--primary-dark))',
                'linear-gradient(135deg, #4a5d68, #3a4a55)',
                'linear-gradient(135deg, #3a4a55, #263238)',
                'linear-gradient(135deg, #4a5d68, #263238)',
            ];
            const gradient = gradients[id % gradients.length];

            document.getElementById('mainContent').innerHTML = `
                <div class="article-display">
                    <div class="article-cover" style="background: ${gradient};">✎</div>
                    <div class="article-body">
                        <h1>${article.title}</h1>
                        <div class="meta-bar">
                            <span>📅 ${formatDate(article.created_at)}</span>
                            <span>🏷️ ${article.category}</span>
                            <span>⏱️ ${Math.max(1, Math.ceil(article.content.split(' ').length / 150))} min</span>
                        </div>
                        <div class="content">${formatContent(article.content)}</div>
                    </div>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        function formatContent(text) {
            if (!text) return '<p>—</p>';
            return text
                .split('\n\n')
                .map(para => `<p>${para.replace(/\n/g, '<br>')}</p>`)
                .join('');
        }

        function showWelcome() {
            activeArticleId = null;
            renderSidebar();
            const uniqueCategories = [...new Set(articles.map(a => a.category))].filter(Boolean);
            document.getElementById('mainContent').innerHTML = `
                <div class="article-display">
                    <div class="welcome-section">
                        <h1>Selamat Datang</h1>
                        <p>Ruang pribadi untuk merefleksikan hari, menyimpan ide, dan mencatat perjalanan hidup saya. Setiap kata yang saya tulis adalah warisan untuk diri sendiri di masa depan.</p>
                        <div class="stats">
                            <div class="stat-item"><div class="number">${articles.length}</div><div class="label">catatan</div></div>
                            <div class="stat-item"><div class="number">${uniqueCategories.length || '-'}</div><div class="label">kategori</div></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function searchArticles() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderSidebar(articles.filter(a => 
                a.title.toLowerCase().includes(query) || 
                a.category.toLowerCase().includes(query) ||
                a.content.toLowerCase().includes(query)
            ));
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
            document.getElementById('hamburger').classList.toggle('active');
            document.body.classList.toggle('sidebar-open');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('show');
            document.getElementById('hamburger').classList.remove('active');
            document.body.classList.remove('sidebar-open');
        }

        function openModal() {
            document.getElementById('modalOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            document.body.style.overflow = '';
        }

        async function submitArticle(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const title = document.getElementById('inputTitle').value.trim();
            const category = document.getElementById('inputCategory').value;
            const content = document.getElementById('inputContent').value.trim();

            if (!title || !content) return;

            btn.disabled = true;
            btn.textContent = 'menyimpan...';

            const { data, error } = await supabaseClient
                .from('articles')
                .insert({ title, category, content })
                .select()
                .single();

            btn.disabled = false;
            btn.textContent = 'simpan catatan';

            if (error) {
                alert('❌ gagal: ' + error.message);
                return;
            }

            closeModal();
            document.getElementById('inputTitle').value = '';
            document.getElementById('inputContent').value = '';
            
            await fetchArticles();
            if (data) showArticle(data.id);
            
            showNotification('✅ catatan tersimpan');
        }

        function showNotification(msg) {
            const el = document.createElement('div');
            el.textContent = msg;
            el.style.cssText = `position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--primary);color:white;padding:10px 20px;border-radius:10px;box-shadow:0 4px 18px rgba(38,50,56,0.2);z-index:3000;font-weight:400;font-size:11px;border-left:2px solid var(--accent);font-family:var(--font-mono);letter-spacing:0.3px;text-transform:uppercase;`;
            document.body.appendChild(el);
            setTimeout(() => { 
                el.style.opacity = '0'; 
                el.style.transition = 'opacity 0.3s ease'; 
                setTimeout(() => el.remove(), 300); 
            }, 2000);
        }

        document.getElementById('modalOverlay').addEventListener('click', e => { 
            if (e.target === e.currentTarget) closeModal(); 
        });
        window.addEventListener('resize', () => { 
            if (window.innerWidth > 768) closeSidebar(); 
        });
        
        fetchArticles();
    </script>
</body>
</html>
